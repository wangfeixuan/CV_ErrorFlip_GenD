seed: 2026

data:
  frames_per_video: 4
  feature_dim: 1024
  split_ratios:
    train: 0.85
    validation: 0.15
    test: 0.0

degradation:
  type: gaussian_blur
  kernel: 9
  trained_blurred_frames: 2

model:
  bottleneck: 128
  dropout: 0.10
  scale_init: 0.00

training:
  epochs: 60
  patience: 12
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  clean_loss_weight: 0.50
  degraded_loss_weight: 1.00
  consistency_weight: 5.00
  restoration_weight: 5.00
  flip_weight: 3.00
  gradient_clip: 1.0
  threshold: 0.50

evaluation:
  threshold: 0.50
  primary_blurred_frames: 2
